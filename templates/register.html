{% extends "base.html" %}

{% block title %}회원가입{% endblock %}

{% block content %}
<div class="container auth-page">
  <div class="auth-card">
    <h2>회원가입</h2>
    <form method="post" action="{{ url_for('register') }}">
      <div class="form-group">
        <label>아이디</label>
        <input type="text" name="username" required placeholder="사용할 아이디">
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" name="email" placeholder="이메일 (선택)">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" name="password" required placeholder="비밀번호">
      </div>
      <button type="submit" class="btn btn-primary">회원가입</button>
    </form>
    <p class="auth-link">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
  </div>
</div>
{% endblock %}
