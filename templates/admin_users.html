{% extends "base.html" %}

{% block title %}회원 관리{% endblock %}

{% block content %}
<div class="container admin-page">
  <h2>회원 관리</h2>
  <table class="data-table">
    <thead>
      <tr>
        <th>아이디</th>
        <th>역할</th>
        <th>이메일</th>
        <th>가입일</th>
        <th>수정</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>
          <span class="badge {{ 'badge-admin' if u.role == 'admin' else 'badge-user' }}">{{ u.role }}</span>
        </td>
        <td>{{ u.email or '-' }}</td>
        <td>{{ u.created_at }}</td>
        <td><a href="{{ url_for('admin_edit_user', user_id=u.id) }}" class="btn btn-small">수정</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
