{% extends "base.html" %}

{% block title %}글 쓰기 - {{ board.name }}{% endblock %}

{% block content %}
<div class="container board-page">
  <h2>{{ board.name }} &mdash; 글 쓰기</h2>
  <form method="post">
    <div class="form-group">
      <label>제목</label>
      <input type="text" name="title" required placeholder="제목을 입력하세요">
    </div>
    <div class="form-group">
      <label>내용</label>
      <textarea name="content" rows="8" required placeholder="내용을 입력하세요"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">등록</button>
    <a href="{{ url_for('board_view', slug=board.slug) }}" class="btn btn-small">취소</a>
  </form>
</div>
{% endblock %}
