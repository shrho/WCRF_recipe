{% extends "base.html" %}

{% block title %}게시판{% endblock %}

{% block content %}
<div class="container board-page">
  <h2>게시판</h2>
  <div class="board-grid">
    {% for b in boards %}
    <a href="{{ url_for('board_view', slug=b.slug) }}" class="board-card">
      <h3>{{ b.name }}</h3>
      <p>{{ b.description or '' }}</p>
      <span class="board-count">{{ b.post_count }}개의 글</span>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
